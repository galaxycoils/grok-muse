[package]
name = "gm-llm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { workspace = true }
gm-core = { workspace = true }
darius-daemon = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
parking_lot = { workspace = true }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[features]
default = []
local-vlm = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }


[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
