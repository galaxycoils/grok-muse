[package]
name = "gm-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gm-ui"
path = "src/main.rs"

[dependencies]
gm-llm = { workspace = true }
zeroize = "1"
rfd = "=0.17.2"
base64 = "0.22"
uuid = { workspace = true }
# eframe with default features disabled needs explicit native WGPU backends.
wgpu = { version = "27", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit"] }
gm-core = { workspace = true }
gm-platform = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
gm-daemon = { workspace = true }
libc = { workspace = true }

[build-dependencies]
cc = "1.2"

