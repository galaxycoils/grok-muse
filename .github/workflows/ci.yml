name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Check & Test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Grok-Muse
        uses: actions/checkout@v4
        with:
          path: grok-muse

      - name: Checkout Darius
        uses: actions/checkout@v4
        with:
          repository: galaxycoils/darius
          ref: f47a4ce980abecb751c9f5c79e1c424a20100433
          path: Darius

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libpipewire-0.3-dev libspa-0.2-dev clang xvfb

      - name: Check formatting
        working-directory: grok-muse
        run: cargo fmt --all -- --check

      - name: Clippy check (macOS)
        if: runner.os == 'macOS'
        working-directory: grok-muse
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Clippy check (Linux)
        if: runner.os != 'macOS'
        working-directory: grok-muse
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Windows target platform foundations
        if: runner.os == 'Linux'
        working-directory: grok-muse
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo check --target x86_64-pc-windows-gnu -p gm-platform -p gm-core -p gm-cu-helper

      - name: Run nextest (macOS)
        if: runner.os == 'macOS'
        working-directory: grok-muse
        run: cargo nextest run --workspace --all-features

      - name: Run nextest (Linux)
        if: runner.os != 'macOS'
        working-directory: grok-muse
        run: cargo nextest run --workspace

      - name: Verify workspace guest protocol
        if: runner.os == 'Linux'
        working-directory: grok-muse
        run: python3 tools/workspace-guest/test_agent.py

      - name: Verify release signatures and evidence gate regressions
        if: runner.os == 'Linux'
        working-directory: grok-muse
        run: python3 tools/test_release_tools.py

      - name: Verify real X11 capture and input
        if: runner.os == 'Linux'
        working-directory: grok-muse
        run: tools/test-native-x11.sh

      - name: Run G5 eval suite gate
        working-directory: grok-muse
        run: cargo run -p xtask -- eval

      - name: Benchmark G4 LLM latency gate
        working-directory: grok-muse
        run: cargo run -p xtask -- bench-llm

      - name: Verify release DMG pipeline (macOS only)
        if: runner.os == 'macOS'
        working-directory: grok-muse
        run: cargo run -p xtask -- verify-dmg

