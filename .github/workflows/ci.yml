name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Check & Test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Grok-Muse
        uses: actions/checkout@v4
        with:
          path: grok-muse

      - name: Checkout Darius
        uses: actions/checkout@v4
        with:
          repository: galaxycoils/darius
          path: Darius

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev

      - name: Check formatting
        working-directory: grok-muse
        run: cargo fmt --all -- --check

      - name: Clippy check (macOS)
        if: runner.os == 'macOS'
        working-directory: grok-muse
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Clippy check (Linux)
        if: runner.os == 'Linux'
        working-directory: grok-muse
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Windows target platform foundations
        if: runner.os == 'Linux'
        working-directory: grok-muse
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo check --target x86_64-pc-windows-gnu -p gm-platform -p gm-core -p gm-cu-helper

      - name: Run nextest (macOS)
        if: runner.os == 'macOS'
        working-directory: grok-muse
        run: cargo nextest run --workspace --all-features

      - name: Run nextest (Linux)
        if: runner.os == 'Linux'
        working-directory: grok-muse
        run: cargo nextest run --workspace

      - name: Run G5 eval suite gate
        working-directory: grok-muse
        run: cargo run -p xtask -- eval

      - name: Benchmark G3 local hot-path budgets (macOS only)
        if: runner.os == 'macOS'
        working-directory: grok-muse
        run: cargo run -p xtask -- bench-hotpath

      - name: Benchmark G4 LLM latency gate
        working-directory: grok-muse
        run: cargo run -p xtask -- bench-llm

      - name: Verify release DMG pipeline (macOS only)
        if: runner.os == 'macOS'
        working-directory: grok-muse
        run: cargo run -p xtask -- verify-dmg

